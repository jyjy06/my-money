<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f6c22e">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="小账本">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" href="icon-192.png">
<title>校园小账本</title>
<style>
/* Layout: single narrow column, summary on top, entry sheet, then day-grouped ledger */
:root{
  --bg:#f6f7f5; --surface:#ffffff; --fg:#1d2420; --muted:#6f7a73; --line:#e3e7e3;
  --accent:#2f5d50; --accent-soft:#e4eeea; --out:#b4483c; --in:#2f7a4f; --warn:#c2862b;
  --sans:"PingFang SC","Noto Sans SC","Microsoft YaHei",system-ui,sans-serif;
  --mono:ui-monospace,"SF Mono",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#141816; --surface:#1c211e; --fg:#e7ebe8; --muted:#8f9a94; --line:#2b322e;
  --accent:#8cc2ae; --accent-soft:#24312c; --out:#e58a7e; --in:#7fc89b; --warn:#e2b061; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#141816; --surface:#1c211e; --fg:#e7ebe8; --muted:#8f9a94; --line:#2b322e;
  --accent:#8cc2ae; --accent-soft:#24312c; --out:#e58a7e; --in:#7fc89b; --warn:#e2b061; color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:15px;line-height:1.5}
.wrap{max-width:520px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:flex;flex-direction:column;gap:22px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

header{display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;align-items:center;gap:10px}
.brand img{width:36px;height:36px;border-radius:50%}
h1{font-size:18px;font-weight:700;margin:0;letter-spacing:.02em}
.month{display:flex;align-items:center;gap:4px}
.month button{background:none;border:0;width:32px;height:32px;border-radius:8px;color:var(--muted);font-size:18px}
.month button:hover{background:var(--accent-soft);color:var(--accent)}
.month span{min-width:88px;text-align:center;font-size:14px}

.summary{display:flex;flex-direction:column;gap:14px}
.label{font-size:12px;color:var(--muted);letter-spacing:.06em}
.big{font-size:34px;font-weight:600;line-height:1.1}
.row3{display:grid;grid-template-columns:1fr 1fr;gap:12px;border-top:1px solid var(--line);padding-top:12px}
.row3 .v{font-size:16px}
.out{color:var(--out)} .in{color:var(--in)}
.budget{display:flex;flex-direction:column;gap:6px}
.bar{height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px;transition:width .3s}
.bar i.warn{background:var(--warn)} .bar i.over{background:var(--out)}
.budget-line{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:var(--muted)}
.link{background:none;border:0;color:var(--accent);font-size:13px;padding:0}
.link.muted{color:var(--muted)}
.bedit{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:8px;margin-top:4px}
.brow{display:grid;grid-template-columns:56px auto 1fr;gap:8px;align-items:center;font-size:14px}
.brow .rm{font-family:var(--mono);font-size:12px;color:var(--muted)}
.brow input{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:8px;padding:6px 10px;font-family:var(--mono);font-size:14px}
#bcats{display:flex;flex-direction:column;gap:8px}
.bsub{font-size:12px;color:var(--muted);padding-top:6px;border-top:1px solid var(--line);margin-top:4px}
.bactions{display:flex;justify-content:flex-end;align-items:center;gap:16px;padding-top:4px}
.save.small{padding:7px 16px;font-size:14px}
.cat .over{color:var(--out)}

.sheet{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:14px}
.seg{display:inline-flex;background:var(--bg);border-radius:9px;padding:3px;align-self:flex-start}
.seg button{border:0;background:none;padding:5px 16px;border-radius:7px;font-size:14px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}
.amt{display:flex;align-items:baseline;gap:8px;border-bottom:1px solid var(--line);padding-bottom:6px}
.amt span{font-family:var(--mono);color:var(--muted);font-size:16px}
.amt input{flex:1;min-width:0;border:0;background:none;font-family:var(--mono);font-size:28px;color:var(--fg);padding:0;outline:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chips button{border:1px solid var(--line);background:none;border-radius:999px;padding:4px 12px;font-size:13px}
.chips button[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);color:var(--accent)}
.fields{display:grid;grid-template-columns:1fr auto;gap:10px}
.fields input{min-width:0;border:1px solid var(--line);background:var(--bg);color:var(--fg);border-radius:9px;padding:8px 10px;font:inherit;font-size:14px}
.save{border:0;background:var(--accent);color:var(--bg);border-radius:10px;padding:11px;font-weight:500}
.save:disabled{opacity:.4;cursor:default}
.msg{font-size:13px;color:var(--muted);min-height:1em}

section h2{font-size:13px;font-weight:500;color:var(--muted);margin:0 0 10px;letter-spacing:.06em}
.cats{display:flex;flex-direction:column;gap:8px}
.cat{display:grid;grid-template-columns:44px 1fr auto;gap:10px;align-items:center;font-size:13px}
.cat .num{font-size:12px;text-align:right}
.cat .bar{height:5px}

.day{display:flex;flex-direction:column}
.dayhead{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);padding:12px 0 6px;border-bottom:1px solid var(--line)}
.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 0;border-bottom:1px solid var(--line)}
.tag{font-size:12px;width:40px;text-align:center;padding:2px 0;border-radius:6px;background:var(--accent-soft);color:var(--accent)}
.item .note{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.item .note small{color:var(--muted)}
.item .right{display:flex;align-items:center;gap:8px}
.del{border:0;background:none;color:var(--muted);font-size:12px;padding:2px 4px;border-radius:5px}
.del:hover{color:var(--out)}
.del.confirm{color:var(--bg);background:var(--out)}
.empty{color:var(--muted);font-size:14px;padding:20px 0;text-align:center;border:1px dashed var(--line);border-radius:12px}
.backup{display:flex;flex-direction:column;gap:8px;align-items:center;font-size:13px}
.backup .acts{display:flex;gap:18px}
.backup .warnbox{display:flex;gap:14px;align-items:center;color:var(--out)}
.note-bar{font-size:12px;color:var(--muted);text-align:center}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>


<div class="wrap">
  <header>
    <h1 class="brand"><img src="logo-96.png" alt="" width="36" height="36">校园小账本</h1>
    <div class="month">
      <button id="prev" aria-label="上个月">‹</button>
      <span id="mlabel" class="num"></span>
      <button id="next" aria-label="下个月">›</button>
    </div>
  </header>

  <div class="summary">
    <div>
      <div class="label">本月支出</div>
      <div class="big num out" id="sumOut">RM 0.00</div>
    </div>
    <div class="budget" id="budgetBox">
      <div class="bar"><i id="budgetBar" style="width:0"></i></div>
      <div class="budget-line"><span id="budgetText">还没有设置月预算</span><button class="link" id="budgetBtn" aria-expanded="false">设置预算</button></div>
      <div id="budgetEdit" class="bedit" hidden>
        <div class="brow"><label for="b_total">总预算</label><span class="rm">RM</span><input id="b_total" inputmode="decimal" placeholder="不限"></div>
        <div class="bsub">分类预算（留空表示不限）</div>
        <div id="bcats"></div>
        <div class="bactions"><button type="button" class="link muted" id="budgetCancel">取消</button><button type="button" class="save small" id="budgetSave">保存预算</button></div>
      </div>
    </div>
    <div class="row3">
      <div><div class="label">收入</div><div class="v num in" id="sumIn">RM 0.00</div></div>
      <div><div class="label">结余</div><div class="v num" id="sumBal">RM 0.00</div></div>
    </div>
  </div>

  <form class="sheet" id="form" autocomplete="off">
    <div class="seg" role="group" aria-label="类型">
      <button type="button" id="tOut" aria-pressed="true">支出</button>
      <button type="button" id="tIn" aria-pressed="false">收入</button>
    </div>
    <label class="amt"><span>RM</span><input id="amount" inputmode="decimal" placeholder="0.00" aria-label="金额"></label>
    <div class="chips" id="chips"></div>
    <div class="fields">
      <input id="note" placeholder="备注（可选）" maxlength="40">
      <input id="date" type="date" aria-label="日期">
    </div>
    <button class="save" id="saveBtn" type="submit" disabled>记一笔</button>
    <div class="msg" id="msg"></div>
  </form>

  <section id="catSec" hidden>
    <h2>支出分类</h2>
    <div class="cats" id="cats"></div>
  </section>

  <section>
    <h2>明细</h2>
    <div id="list"><div class="empty">正在读取账本…</div></div>
  </section>

  <div class="backup">
    <div class="acts"><button type="button" class="link" id="exportBtn">导出备份</button><button type="button" class="link" id="importBtn">导入备份</button></div>
    <input type="file" id="importFile" accept=".json,application/json" hidden>
    <div class="warnbox" id="importConfirm" hidden><span id="importText"></span><button type="button" class="link muted" id="importNo">取消</button><button type="button" class="save small" id="importYes">覆盖</button></div>
  </div>
  <div class="note-bar" id="storeNote"></div>
</div>

<script>
const CATS = {
  out:["餐饮","交通","学习","日用","娱乐","住宿","通讯","其他"],
  in:["生活费","兼职","奖学金","其他"]
};
const $ = id => document.getElementById(id);
const pad = n => String(n).padStart(2,"0");
const today = () => { const d=new Date(); return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`; };
const money = c => "RM " + (c/100).toLocaleString("en-MY",{minimumFractionDigits:2,maximumFractionDigits:2});
const toCents = s => { const v = parseFloat(String(s).replace(/,/g,"")); return isFinite(v) && v>0 ? Math.round(v*100) : 0; };

let type = "out", cat = CATS.out[0];
let ym = (() => { const d=new Date(); return {y:d.getFullYear(), m:d.getMonth()+1}; })();
let entries = [], budget = 0, catBudgets = {};
let store = null;

/* ---------- storage: this phone only ---------- */
function localStore(){
  const K="campus-ledger-v1";
  const load=()=>{try{return JSON.parse(localStorage.getItem(K))||{entries:[],budget:0,catBudgets:{}}}catch(e){return {entries:[],budget:0,catBudgets:{}}}};
  const save=d=>{localStorage.setItem(K,JSON.stringify(d))};
  let listener=null, range=null;
  const emit=()=>{ if(!listener) return; const d=load(); listener(d.entries.filter(e=>e.date>=range[0]&&e.date<=range[1])); };
  return {
    cloud:false,
    watchMonth(a,b,cb){ listener=cb; range=[a,b]; emit(); return ()=>{listener=null}; },
    watchBudget(cb){ const d=load(); cb(d.budget||0,d.catBudgets||{}); },
    async add(e){ const d=load(); d.entries.push({...e,id:Date.now().toString(36)+Math.random().toString(36).slice(2,6)}); save(d); emit(); },
    async remove(id){ const d=load(); d.entries=d.entries.filter(x=>x.id!==id); save(d); emit(); },
    async setBudget(c,cb){ const d=load(); d.budget=c; d.catBudgets=cb; save(d); },
    dump(){ return load(); },
    replace(d){ save(d); emit(); }
  };
}
/* ---------- rendering ---------- */
function renderChips(){
  $("chips").innerHTML="";
  CATS[type].forEach(c=>{
    const b=document.createElement("button"); b.type="button"; b.textContent=c;
    b.setAttribute("aria-pressed", c===cat); b.onclick=()=>{cat=c;renderChips()};
    $("chips").appendChild(b);
  });
}
function setType(t){
  type=t; cat=CATS[t][0];
  $("tOut").setAttribute("aria-pressed",t==="out"); $("tIn").setAttribute("aria-pressed",t==="in");
  renderChips();
}
function render(){
  $("mlabel").textContent = `${ym.y} 年 ${ym.m} 月`;
  const out = entries.filter(e=>e.type==="out").reduce((s,e)=>s+e.amount,0);
  const inc = entries.filter(e=>e.type==="in").reduce((s,e)=>s+e.amount,0);
  $("sumOut").textContent=money(out); $("sumIn").textContent=money(inc);
  $("sumBal").textContent=(inc-out<0?"−":"")+money(Math.abs(inc-out));

  // budget
  const bar=$("budgetBar");
  if(budget>0){
    const p=out/budget; bar.style.width=Math.min(100,p*100)+"%";
    bar.className = p>1?"over":p>.8?"warn":"";
    const left=budget-out;
    $("budgetText").textContent = left>=0 ? `预算 ${money(budget)} · 还剩 ${money(left)}` : `预算 ${money(budget)} · 超出 ${money(-left)}`;
    $("budgetBtn").textContent="修改";
  } else {
    bar.style.width="0";
    const n=Object.keys(catBudgets).length;
    $("budgetText").textContent= n ? `已设 ${n} 个分类预算` : "还没有设置月预算";
    $("budgetBtn").textContent= n ? "修改" : "设置预算";
  }
  $("budgetBox").querySelector(".bar").hidden=!(budget>0);

  // categories: spent this month, against its own budget when one is set
  const byCat={}; entries.filter(e=>e.type==="out").forEach(e=>byCat[e.cat]=(byCat[e.cat]||0)+e.amount);
  const shown=CATS.out.filter(c=>byCat[c]||catBudgets[c]);
  shown.sort((a,b)=>(byCat[b]||0)-(byCat[a]||0));
  const maxSpent=Math.max(1,...shown.map(c=>byCat[c]||0));
  $("catSec").hidden=!shown.length; $("cats").innerHTML="";
  shown.forEach(c=>{
    const v=byCat[c]||0, cap=catBudgets[c]||0;
    const r=document.createElement("div"); r.className="cat";
    r.innerHTML=`<span></span><div class="bar"><i></i></div><span class="num"></span>`;
    r.children[0].textContent=c;
    const bar=r.querySelector("i"), lab=r.children[2];
    if(cap){
      const p=v/cap; bar.style.width=Math.min(100,p*100)+"%"; bar.className=p>1?"over":p>.8?"warn":"";
      lab.textContent=`${money(v).slice(3)} / ${money(cap).slice(3)}`; if(p>1) lab.classList.add("over");
    } else {
      bar.style.width=(v/maxSpent*100).toFixed(1)+"%";
      lab.textContent=money(v)+(out?` · ${Math.round(v/out*100)}%`:"");
    }
    $("cats").appendChild(r);
  });

  // list
  const list=$("list"); list.innerHTML="";
  if(!entries.length){ list.innerHTML=`<div class="empty">这个月还没有记录。<br>在上面输入金额，点「记一笔」就好。</div>`; return; }
  const days={}; entries.forEach(e=>(days[e.date]=days[e.date]||[]).push(e));
  Object.keys(days).sort().reverse().forEach(d=>{
    const items=days[d].sort((a,b)=>(b.created||0)-(a.created||0));
    const dOut=items.filter(e=>e.type==="out").reduce((s,e)=>s+e.amount,0);
    const box=document.createElement("div"); box.className="day";
    const wk="日一二三四五六"[new Date(d+"T00:00").getDay()];
    box.innerHTML=`<div class="dayhead"><span class="num">${d.slice(8)}/${d.slice(5,7)} 周${wk}</span><span class="num">${dOut?"支出 "+money(dOut):""}</span></div>`;
    items.forEach(e=>{
      const it=document.createElement("div"); it.className="item";
      it.innerHTML=`<span class="tag"></span><span class="note"></span><span class="right"><span class="num ${e.type}"></span><button class="del" type="button">删除</button></span>`;
      it.querySelector(".tag").textContent=e.cat;
      it.querySelector(".note").textContent=e.note||"";
      if(!e.note){ it.querySelector(".note").innerHTML="<small>—</small>"; }
      it.querySelector(".num").textContent=(e.type==="out"?"−":"+")+money(e.amount).slice(3);
      const del=it.querySelector(".del");
      del.onclick=async()=>{
        if(!del.classList.contains("confirm")){ del.classList.add("confirm"); del.textContent="确认删除"; setTimeout(()=>{del.classList.remove("confirm");del.textContent="删除"},3000); return; }
        del.disabled=true;
        try{ await store.remove(e.id); }catch(err){ showMsg("删除失败，请再试一次。"); del.disabled=false; }
      };
      box.appendChild(it);
    });
    list.appendChild(box);
  });
}
function showMsg(t){ $("msg").textContent=t; clearTimeout(showMsg.t); showMsg.t=setTimeout(()=>$("msg").textContent="",3000); }

/* ---------- month subscription ---------- */
let unsub=null;
function watch(){
  if(unsub) unsub();
  const a=`${ym.y}-${pad(ym.m)}-01`, b=`${ym.y}-${pad(ym.m)}-31`;
  entries=[]; render();
  unsub=store.watchMonth(a,b,rows=>{entries=rows; render();});
}
function shift(n){ let m=ym.m+n,y=ym.y; if(m<1){m=12;y--} if(m>12){m=1;y++} ym={y,m}; watch(); }

/* ---------- events ---------- */
$("tOut").onclick=()=>setType("out"); $("tIn").onclick=()=>setType("in");
$("prev").onclick=()=>shift(-1); $("next").onclick=()=>shift(1);
$("amount").oninput=()=>{ $("saveBtn").disabled=!store||!toCents($("amount").value); };
function openBudget(open){
  $("budgetEdit").hidden=!open; $("budgetBtn").setAttribute("aria-expanded",open);
  $("budgetBtn").hidden=open;
  if(!open) return;
  $("b_total").value=budget?budget/100:"";
  $("bcats").innerHTML="";
  CATS.out.forEach((c,i)=>{
    const r=document.createElement("div"); r.className="brow";
    r.innerHTML=`<label for="b_c${i}"></label><span class="rm">RM</span><input id="b_c${i}" inputmode="decimal" placeholder="不限">`;
    r.querySelector("label").textContent=c;
    r.querySelector("input").value=catBudgets[c]?catBudgets[c]/100:"";
    r.querySelector("input").dataset.cat=c;
    $("bcats").appendChild(r);
  });
  $("b_total").focus();
}
$("budgetBtn").onclick=()=>openBudget(true);
$("budgetCancel").onclick=()=>openBudget(false);
$("budgetSave").onclick=async()=>{
  const total=toCents($("b_total").value);
  const cb={}; $("bcats").querySelectorAll("input").forEach(i=>{const v=toCents(i.value); if(v) cb[i.dataset.cat]=v;});
  try{ await store.setBudget(total,cb); budget=total; catBudgets=cb; openBudget(false); render(); }
  catch(e){ showMsg("预算没有保存成功，请再试一次。"); }
};
$("form").onsubmit=async ev=>{
  ev.preventDefault();
  const amount=toCents($("amount").value); if(!amount||!store) return;
  const e={type,amount,cat,note:$("note").value.trim(),date:$("date").value||today(),created:Date.now()};
  $("saveBtn").disabled=true;
  try{
    await store.add(e);
    $("amount").value=""; $("note").value="";
    const [y,m]=e.date.split("-").map(Number);
    if(y!==ym.y||m!==ym.m){ ym={y,m}; watch(); }
    showMsg(`已记下 ${e.cat} ${money(amount)}`);
  }catch(err){
    showMsg(err&&err.code==="quota_exceeded"?"账本已满，请删除一些旧记录。":"没有保存成功，请再试一次。");
    $("saveBtn").disabled=false;
  }
};

/* ---------- backup ---------- */
$("exportBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify(store.dump(),null,1)],{type:"application/json"});
  const a=document.createElement("a"); a.href=URL.createObjectURL(blob);
  a.download=`账本备份-${today()}.json`; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),5000);
};
let pending=null;
$("importBtn").onclick=()=>$("importFile").click();
$("importFile").onchange=async()=>{
  const f=$("importFile").files[0]; $("importFile").value=""; if(!f) return;
  try{
    const d=JSON.parse(await f.text());
    if(!Array.isArray(d.entries)) throw 0;
    pending={entries:d.entries,budget:d.budget||0,catBudgets:d.catBudgets||{}};
    $("importText").textContent=`备份里有 ${pending.entries.length} 笔，覆盖现在的账本？`;
    $("importConfirm").hidden=false;
  }catch(e){ showMsg("这个文件不是账本备份。"); }
};
$("importNo").onclick=()=>{pending=null;$("importConfirm").hidden=true;};
$("importYes").onclick=()=>{
  if(!pending) return;
  store.replace(pending); budget=pending.budget; catBudgets=pending.catBudgets; pending=null;
  $("importConfirm").hidden=true; render(); showMsg("备份已导入。");
};

/* ---------- boot ---------- */
$("date").value=today(); setType("out"); render();
(async()=>{
  store=localStore();
